<svg viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg">
  <title>传四章释本末：明德为根，无讼为果，听讼为末</title>
  <desc>一棵本末树：根在下方标明德为本，干标修身立本，枝梢结果为无讼为果，另出一枝末梢标听讼为末；示本末先后与源流，末不是轻，本不是唯一。</desc>

  <rect x="0" y="0" width="720" height="480" fill="#F7F4EE"/>

  <text x="360" y="42" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="16" fill="#25211D">本末：明德为根 · 无讼为果 · 听讼为末</text>
  <text x="360" y="66" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#7C6D5C">经一章「物有本末」之示范</text>

  <!-- 根：明德为本 -->
  <rect x="80" y="352" width="200" height="66" rx="10" fill="#FCFAF6" stroke="#DCD5C8" stroke-width="1.5"/>
  <text x="180" y="380" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#994433">明德为本</text>
  <text x="180" y="402" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#7C6D5C">根 · 承重处 · 清源</text>

  <!-- 干：修身立本 -->
  <line x1="180" y1="352" x2="180" y2="262" stroke="#7C6D5C" stroke-width="2"/>
  <rect x="110" y="222" width="140" height="44" rx="8" fill="#FCFAF6" stroke="#DCD5C8" stroke-width="1.5"/>
  <text x="180" y="249" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#25211D">修身立本</text>

  <!-- 果：无讼为果 -->
  <line x1="180" y1="222" x2="180" y2="172" stroke="#7C6D5C" stroke-width="2"/>
  <circle cx="180" cy="128" r="44" fill="#FCFAF6" stroke="#994433" stroke-width="1.5"/>
  <text x="180" y="124" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#994433">无讼</text>
  <text x="180" y="146" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#7C6D5C">为果</text>

  <!-- 梢：听讼为末 -->
  <line x1="250" y1="244" x2="430" y2="232" stroke="#7C6D5C" stroke-width="1.5"/>
  <rect x="430" y="198" width="200" height="66" rx="10" fill="#FCFAF6" stroke="#DCD5C8" stroke-width="1.5"/>
  <text x="530" y="226" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#25211D">听讼为末</text>
  <text x="530" y="248" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#7C6D5C">梢 · 塞流之事 · 治末</text>

  <!-- 箭头标注 -->
  <text x="300" y="300" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#7C6D5C">本立而末自生</text>
  <path d="M 286 296 L 262 296" stroke="#7C6D5C" stroke-width="1.2" fill="none"/>

  <!-- 图说一句 -->
  <line x1="80" y1="442" x2="640" y2="442" stroke="#DCD5C8" stroke-width="1"/>
  <text x="360" y="464" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#7C6D5C">末不是轻，是序；本不是唯一，是承重</text>
</svg>
