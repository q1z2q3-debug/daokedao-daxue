<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" style="background:#F7F4EE">
<title>絜矩六方：中心为己，六向各有一毋，外圈均齐方正</title>
<desc>中心一「己」，向上、下、前、后、左、右六向各出一箭头，每向标一条「所恶……毋以……」；六方量齐，外圈成均齐方正。</desc>
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 z" fill="#994433"/>
</marker>
</defs>

<rect x="0" y="0" width="720" height="480" fill="#F7F4EE"/>
<text x="28" y="26" font-size="12.5" fill="#7C6D5C" letter-spacing="2">图一 · 絜矩六方：以己度人，六方皆准</text>

<!-- 外圈：均齐方正 -->
<rect x="24" y="52" width="672" height="396" rx="20" fill="none" stroke="#DCD5C8" stroke-dasharray="6 5"/>
<text x="360" y="76" font-size="13" fill="#994433" text-anchor="middle" letter-spacing="8">均齐方正</text>

<!-- 六向箭头：由中心己出发 -->
<line x1="360" y1="204" x2="360" y2="142" stroke="#994433" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="360" y1="296" x2="360" y2="358" stroke="#994433" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="322" y1="228" x2="192" y2="188" stroke="#994433" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="398" y1="228" x2="528" y2="188" stroke="#994433" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="322" y1="272" x2="192" y2="312" stroke="#994433" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="398" y1="272" x2="528" y2="312" stroke="#994433" stroke-width="1.2" marker-end="url(#a)"/>

<!-- 中心：己 -->
<circle cx="360" cy="250" r="46" fill="#FCFAF6" stroke="#994433" stroke-width="1.5"/>
<text x="360" y="246" font-size="22" fill="#994433" text-anchor="middle" letter-spacing="2">己</text>
<text x="360" y="268" font-size="11" fill="#7C6D5C" text-anchor="middle">矩在己手</text>

<!-- 上 -->
<rect x="285" y="96" width="150" height="44" fill="#FCFAF6" stroke="#DCD5C8"/>
<text x="360" y="114" font-size="11" fill="#7C6D5C" text-anchor="middle">上</text>
<text x="360" y="132" font-size="11.5" fill="#25211D" text-anchor="middle">所恶于上，毋以使下</text>

<!-- 下 -->
<rect x="285" y="360" width="150" height="44" fill="#FCFAF6" stroke="#DCD5C8"/>
<text x="360" y="378" font-size="11" fill="#7C6D5C" text-anchor="middle">下</text>
<text x="360" y="396" font-size="11.5" fill="#25211D" text-anchor="middle">所恶于下，毋以事上</text>

<!-- 前（左上） -->
<rect x="40" y="158" width="150" height="44" fill="#FCFAF6" stroke="#DCD5C8"/>
<text x="115" y="176" font-size="11" fill="#7C6D5C" text-anchor="middle">前</text>
<text x="115" y="194" font-size="11.5" fill="#25211D" text-anchor="middle">所恶于前，毋以先后</text>

<!-- 后（右上） -->
<rect x="530" y="158" width="150" height="44" fill="#FCFAF6" stroke="#DCD5C8"/>
<text x="605" y="176" font-size="11" fill="#7C6D5C" text-anchor="middle">后</text>
<text x="605" y="194" font-size="11.5" fill="#25211D" text-anchor="middle">所恶于后，毋以从前</text>

<!-- 左（左下） -->
<rect x="40" y="298" width="150" height="44" fill="#FCFAF6" stroke="#DCD5C8"/>
<text x="115" y="316" font-size="11" fill="#7C6D5C" text-anchor="middle">左</text>
<text x="115" y="334" font-size="11.5" fill="#25211D" text-anchor="middle">所恶于左，毋以交于右</text>

<!-- 右（右下） -->
<rect x="530" y="298" width="150" height="44" fill="#FCFAF6" stroke="#DCD5C8"/>
<text x="605" y="316" font-size="11" fill="#7C6D5C" text-anchor="middle">右</text>
<text x="605" y="334" font-size="11.5" fill="#25211D" text-anchor="middle">所恶于右，毋以交于左</text>

<text x="360" y="462" font-size="11.5" fill="#7C6D5C" text-anchor="middle">所操者约，而所及者广；六方两两相对，量齐乃成一方</text>
</svg>
