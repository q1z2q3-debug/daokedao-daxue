<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" style="background:#F7F4EE">
<title>家→国之机：孝弟慈三事经机发动，放大为国之风</title>
<desc>左框家内出孝、弟、慈三事，汇入中央机（发动所由），再放大到右框国：兴仁、兴让、民从之；示教成于国之端绪在家。</desc>
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 z" fill="#994433"/>
</marker>
</defs>

<rect x="0" y="0" width="720" height="480" fill="#F7F4EE"/>
<text x="28" y="26" font-size="12.5" fill="#7C6D5C" letter-spacing="2">图一 · 家→国之机：三事发动，一国兴风</text>

<rect x="40" y="140" width="150" height="200" fill="#FCFAF6" stroke="#DCD5C8"/>
<text x="115" y="170" font-size="16" fill="#25211D" text-anchor="middle">家 · 齐家</text>
<line x1="60" y1="184" x2="170" y2="184" stroke="#DCD5C8"/>
<text x="115" y="212" font-size="13.5" fill="#25211D" text-anchor="middle">孝 → 事君</text>
<text x="115" y="244" font-size="13.5" fill="#25211D" text-anchor="middle">弟 → 事长</text>
<text x="115" y="276" font-size="13.5" fill="#25211D" text-anchor="middle">慈 → 使众</text>
<text x="115" y="314" font-size="11.5" fill="#7C6D5C" text-anchor="middle">不出家而成教于国</text>

<line x1="190" y1="208" x2="304" y2="218" stroke="#994433" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="190" y1="240" x2="304" y2="240" stroke="#994433" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="190" y1="272" x2="304" y2="262" stroke="#994433" stroke-width="1.2" marker-end="url(#a)"/>

<circle cx="360" cy="240" r="56" fill="#FCFAF6" stroke="#994433" stroke-width="1.5"/>
<text x="360" y="234" font-size="22" fill="#994433" text-anchor="middle" letter-spacing="3">机</text>
<text x="360" y="258" font-size="11.5" fill="#7C6D5C" text-anchor="middle">发动所由</text>

<line x1="416" y1="218" x2="530" y2="208" stroke="#994433" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="416" y1="240" x2="530" y2="240" stroke="#994433" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="416" y1="262" x2="530" y2="272" stroke="#994433" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="530" y="140" width="150" height="200" fill="#FCFAF6" stroke="#DCD5C8"/>
<text x="605" y="170" font-size="16" fill="#25211D" text-anchor="middle">国 · 教成于国</text>
<line x1="550" y1="184" x2="660" y2="184" stroke="#DCD5C8"/>
<text x="605" y="212" font-size="13.5" fill="#25211D" text-anchor="middle">一国兴仁</text>
<text x="605" y="244" font-size="13.5" fill="#25211D" text-anchor="middle">一国兴让</text>
<text x="605" y="276" font-size="13.5" fill="#25211D" text-anchor="middle">而民从之</text>
<text x="605" y="314" font-size="11.5" fill="#7C6D5C" text-anchor="middle">足法而后民法之</text>

<text x="360" y="452" font-size="11.5" fill="#7C6D5C" text-anchor="middle">有诸己而后求诸人，无诸己而后非诸人：皆推己以及人，所谓恕也</text>
</svg>
